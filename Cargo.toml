[package]
name = "hit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "实盘信号算法交易执行器聚合平台"
repository = "https://github.com/No-Trade-No-Life/HIT"

[dependencies]
aes-gcm = "0.10"
auth-mini-axum = "0.1.2"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
hmac = "0.12"
http = "1"
mime_guess = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "warn", priority = -2 }
style = { level = "warn", priority = -2 }
complexity = { level = "warn", priority = -2 }
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
semicolon_if_nothing_returned = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
